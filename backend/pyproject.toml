[project]
name = "observatory-backend"
version = "0.1.0"
description = "Observatory — local Claude Code config dashboard backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pyyaml>=6.0.2",
  "watchdog>=5.0",
  "pathspec>=0.12",
  "sse-starlette>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
